name: data-platform-lab

services:
  garage:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-bucket
    restart: unless-stopped
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK891f3bf63f6f2d8d207a0c37
      GARAGE_DEFAULT_SECRET_KEY: 79d8fe0bc2ee28ecc9f293e1ab9201b90122ce215b32d6058cde1a7e21dfa626
      GARAGE_DEFAULT_BUCKET: data-platform-lab
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: data_platform_lab
      POSTGRES_USER: data_platform_lab
      POSTGRES_PASSWORD: data_platform_lab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./sql/platform/001_pipeline_runs.sql:/docker-entrypoint-initdb.d/001_pipeline_runs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_platform_lab -d data_platform_lab"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  garage-meta:
  garage-data:
  postgres-data:
