[tool.poetry]
name = "data-platform-lab"
version = "0.1.0"
description = "Hands-on data engineering lab — batch pipelines, streaming, validation, storage, and orchestration exercises."
authors = []
readme = "README.md"
license = "MIT"
packages = [{ include = "data_platform_lab", from = "src" }]
include = [{ path = "src/data_platform_lab/curation/sql/*.sql", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
boto3 = ">=1.40,<2.0"
confluent-kafka = "2.15.0"
DataExcept = "1.2.0"
psycopg = {version = ">=3.2,<4.0", extras = ["binary"]}
pyiceberg = {version = "0.11.1", extras = ["pyarrow", "s3fs", "sql-postgres"]}
duckdb = {version = ">=2.0,<3.0", optional = true}

[tool.poetry.extras]
analytics = ["duckdb"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.4"
mypy = ">=1.10"

[tool.poetry.scripts]
data-platform-lab = "data_platform_lab.cli.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
