services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ons_pay_demo
      POSTGRES_USER: ons_pay_demo
      POSTGRES_PASSWORD: local_demo_only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ons_pay_demo -d ons_pay_demo"]
      interval: 5s
      timeout: 3s
      retries: 30
  mongodb:
    image: mongo:9.0.4
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
  runner:
    build:
      context: ../..
      dockerfile: infra/ons-pay-demo/Dockerfile
    user: "${ONS_PAY_DEMO_UID:-0}:${ONS_PAY_DEMO_GID:-0}"
    volumes:
      - type: bind
        source: ${ONS_PAY_DEMO_OUTPUT:?Use the demo launcher to select an isolated output directory}
        target: /output

# Runtime services have no host ports or external-network route. Image/package
# downloads happen during setup, before this isolated synthetic-data workflow.
networks:
  default:
    internal: true
