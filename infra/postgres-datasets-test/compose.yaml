# Only the opt-in test fixture launches this under a unique project name.
services:
  postgres:
    image: postgres:18.6
    init: true
    environment:
      POSTGRES_DB: dpl_persistence_test
      POSTGRES_USER: dpl_test_admin
      POSTGRES_PASSWORD: ${DPL_PG_TEST_PASSWORD:?The test must generate a private password}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "dpl_test_admin", "-d", "dpl_persistence_test"]
      interval: 1s
      timeout: 3s
      retries: 60
volumes:
  test-data:
