name: Python

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "scripts/ons_pay_publishing_demo.py"
      - "scripts/ons_pay_reader.py"
      - "data/sample/**"
      - "sql/**"
      - ".github/workflows/python.yml"
      - ".pre-commit-config.yaml"
  pull_request:
    paths:
      - "python/**"
      - "scripts/ons_pay_publishing_demo.py"
      - "scripts/ons_pay_reader.py"
      - "data/sample/**"
      - "sql/**"
      - ".github/workflows/python.yml"
      - ".pre-commit-config.yaml"

defaults:
  run:
    working-directory: python

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Configure Poetry in-project venv
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: python/.venv
          key: py-venv-${{ runner.os }}-3.11-${{ hashFiles('python/pyproject.toml', 'python/poetry.lock') }}
          restore-keys: py-venv-${{ runner.os }}-3.11-

      - name: Install dependencies with serving contract types
        run: |
          poetry check --lock
          poetry sync --no-interaction --extras serving
          git diff --exit-code -- poetry.lock

      - name: Ruff lint
        run: poetry run ruff check --config pyproject.toml . ../scripts

      - name: Ruff format check
        run: poetry run ruff format --config pyproject.toml --check . ../scripts

      - name: Mypy strict type-check
        run: poetry run mypy src/ ../scripts

  windows-refresh:
    name: Test refresh (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Configure Poetry in-project venv
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: python/.venv
          key: py-venv-${{ runner.os }}-3.14-${{ hashFiles('python/pyproject.toml', 'python/poetry.lock') }}

      - name: Install locked dependencies
        run: |
          poetry check --lock
          poetry sync --no-interaction --extras serving
          git diff --exit-code -- poetry.lock

      - name: Test local refresh and process guards
        run: >-
          poetry run pytest -q --basetemp="${{ runner.temp }}/ons-pay"
          tests/test_local_run_guard.py tests/test_ons_pay_refresh_guard.py
          tests/test_ons_pay_refresh.py tests/test_ons_pay_remote_refresh.py
          tests/test_ons_pay_refresh_job.py
          tests/test_ons_pay_load_only.py
          tests/test_ons_pay_job_preparation.py
          tests/test_ons_pay_job_status.py
          tests/test_ons_pay_transform.py
          tests/test_ons_pay_transform_monitor.py
          tests/test_registry_verified_reuse.py
          tests/test_ons_pay_load_verification.py
          tests/test_ons_pay_s3_storage.py
          tests/test_ons_pay_s3_verification.py

  test:
    # Preserve the existing 3.11 status-check name for branch protection.
    name: ${{ matrix.python-version == '3.11' && 'Test & smoke' || format('Test & smoke (Python {0})', matrix.python-version) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Configure Poetry in-project venv
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: python/.venv
          key: py-venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('python/pyproject.toml', 'python/poetry.lock') }}
          restore-keys: py-venv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies with analytics and serving models
        run: |
          poetry check --lock
          poetry sync --no-interaction --extras serving
          git diff --exit-code -- poetry.lock

      - name: Run tests
        if: matrix.python-version != '3.11'
        run: poetry run pytest

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: >-
          poetry run pytest --cov=src/data_platform_lab
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Upload coverage reports
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            python/coverage.xml
            python/htmlcov/
          if-no-files-found: error

      - name: "Smoke: e-commerce demo"
        run: poetry run python -m data_platform_lab.demo --data-dir ../data/sample --output-dir /tmp/demo/silver --manifest-dir /tmp/demo/manifests

      - name: "Smoke: sensor demo"
        run: poetry run python -m data_platform_lab.sensor_demo --data-dir ../data/sample --output-dir /tmp/sensor/silver --manifest-dir /tmp/sensor/manifests
