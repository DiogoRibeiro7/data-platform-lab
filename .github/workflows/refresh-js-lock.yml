name: Refresh JavaScript lockfile

on:
  push:
    branches:
      - feat/m3-s3-object-storage
    paths:
      - ".github/workflows/refresh-js-lock.yml"
      - "javascript/package.json"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m3-s3-object-storage

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Refresh Yarn lockfile
        working-directory: javascript
        env:
          YARN_ENABLE_HARDENED_MODE: "0"
        run: yarn install --no-immutable

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- javascript/yarn.lock; then
            echo "yarn.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add javascript/yarn.lock
          git commit -m "chore: refresh JavaScript lockfile"
          git push origin HEAD:feat/m3-s3-object-storage
