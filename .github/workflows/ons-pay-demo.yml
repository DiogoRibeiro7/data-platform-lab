name: ONS Pay Publishing Demo

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "scripts/ons_pay_publishing_demo.py"
      - "infra/ons-pay-demo/**"
      - ".dockerignore"
      - ".github/workflows/ons-pay-demo.yml"
  pull_request:
    paths:
      - "python/**"
      - "scripts/ons_pay_publishing_demo.py"
      - "infra/ons-pay-demo/**"
      - ".dockerignore"
      - ".github/workflows/ons-pay-demo.yml"

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install locked smoke test runner
        working-directory: python
        run: |
          poetry check --lock
          poetry sync --only dev --no-root --no-interaction
          git diff --exit-code -- poetry.lock
      - name: Run the documented entry point twice
        working-directory: python
        env:
          ONS_PAY_LIVE_DEMO: "1"
        run: poetry run pytest -q tests/test_ons_pay_demo_live.py --basetemp ../demo-test-output
      - name: Retain reports, evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ons-pay-demo-evidence
          path: demo-test-output/
          include-hidden-files: true
