name: ONS Pay Publishing Demo

on:
  push:
    paths:
      - "python/**"
      - "scripts/ons_pay_publishing_demo.py"
      - "infra/ons-pay-demo/**"
      - ".dockerignore"
      - ".github/workflows/ons-pay-demo.yml"
  pull_request:
    paths:
      - "python/**"
      - "scripts/ons_pay_publishing_demo.py"
      - "infra/ons-pay-demo/**"
      - ".dockerignore"
      - ".github/workflows/ons-pay-demo.yml"

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke test runner
        run: python -m pip install pytest
      - name: Run the documented entry point twice
        env:
          ONS_PAY_LIVE_DEMO: "1"
        run: python -m pytest -q python/tests/test_ons_pay_demo_live.py --basetemp demo-test-output
      - name: Retain reports, evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ons-pay-demo-evidence
          path: demo-test-output/
          include-hidden-files: true
